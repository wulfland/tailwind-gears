# Chapter 15 reference workflow. Replace .github/workflows/deploy.yml from Chapter 11
# with this file in your fork. Instead of building, it downloads the archive that a
# Release run attested (give the run's id as the input) and verifies the attestation
# against this repository, the release workflow, the main branch, and the commit of
# that run. Only then does it deploy the archive through the staging and production
# environments from Chapter 11. The archive holds the built site only; the server
# runs from a checkout, so both environments check out exactly the verified commit.
# Outside a terminal, gh attestation verify prints nothing when it succeeds, so the
# step sets GH_FORCE_TTY for that one command to get its criteria and result in the log.
name: Deploy
on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: The id of the Release workflow run whose artifact to deploy
        required: true
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      attestations: read
    outputs:
      commit: ${{ steps.provenance.outputs.commit }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
    steps:
      - name: Download the attested archive
        run: gh run download "$RELEASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name site
      - name: Verify the build's provenance
        id: provenance
        run: |
          commit="$(gh run view "$RELEASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)"
          GH_FORCE_TTY=120 gh attestation verify tailwind-gears-site.tgz \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref refs/heads/main \
            --source-digest "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: verified-site
          path: tailwind-gears-site.tgz
  deploy-staging:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify.outputs.commit }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: verified-site
      - run: tar -xzf tailwind-gears-site.tgz
      - name: Start the build and check the catalog API
        run: |
          npm start &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5173/api/health && break
            sleep 1
          done
          curl -sf "http://127.0.0.1:5173/api/products?q=Helmet" > smoke.json
          grep -q '"total":2' smoke.json
  deploy-production:
    needs: [verify, deploy-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify.outputs.commit }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: verified-site
      - run: tar -xzf tailwind-gears-site.tgz
      - name: Start the build and check the catalog API
        run: |
          npm start &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5173/api/health && break
            sleep 1
          done
          curl -sf "http://127.0.0.1:5173/api/products?q=Helmet" > smoke.json
          grep -q '"total":2' smoke.json
