# Chapter 15 reference workflow for the first provenance experiment. Copy it to
# .github/workflows/release-experiment.yml on a branch named practice/... and push.
# It runs on that push: a workflow file that exists only on a practice branch
# cannot be started by hand, because workflow_dispatch needs the file on the
# default branch. It builds and attests the same archive as release.yml, but it
# is a different workflow, so a deployment that verifies with --signer-workflow
# release.yml must reject its artifact even though the signature is valid.
name: Release experiment
on:
  push:
    branches: ['practice/**']
    paths: ['.github/workflows/release-experiment.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: tar -czf tailwind-gears-site.tgz dist
      - uses: actions/attest@v4
        with:
          subject-path: tailwind-gears-site.tgz
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: tailwind-gears-site.tgz
