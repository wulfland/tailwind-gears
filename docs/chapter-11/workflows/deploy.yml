# Chapter 11 reference workflow. Copy this file to .github/workflows/deploy.yml in
# your fork. It deploys the built catalog to the runner that built it, which is
# enough to practice environments, approvals, and promotion without a cloud account.
name: Deploy
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      - name: Start the build and check the catalog API
        run: |
          npm start &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5173/api/health && break
            sleep 1
          done
          curl -sf "http://127.0.0.1:5173/api/products?q=Helmet" > smoke.json
          grep -q '"total":2' smoke.json
  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      - name: Start the build and check the catalog API
        run: |
          npm start &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5173/api/health && break
            sleep 1
          done
          curl -sf "http://127.0.0.1:5173/api/products?q=Helmet" > smoke.json
          grep -q '"total":2' smoke.json
